<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Circlo</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<link rel="stylesheet" href="css/circlo-v2.css">

</head>

<body>

<!-- =========================
     AUTH SCREEN
========================= -->

<div id="authScreen">

  <div class="authBox">

    <h2 id="authTitle">
      Login
    </h2>

    <input
      id="email"
      placeholder="Email"
    />

    <input
      id="password"
      type="password"
      placeholder="Password"
    />

    <button
      class="authBtn"
      onclick="authAction()">

      Continue

    </button>

    <div
      class="switchText"
      onclick="toggleMode()">

      Create account

    </div>

  </div>

</div>

<!-- =========================
     NAVBAR
========================= -->

<nav>

  <div class="logo">
    CIRCLO
  </div>

  <div class="navActions">

    <!-- FRIENDS -->

    <button
      class="navBtn"
      onclick="toggleFriends()">

      <i class="fa-solid fa-user-group"></i>

    </button>

    <!-- CHAT -->

    <button class="navBtn messengerBtn" onclick="toggleDM()">

      <i class="fa-brands fa-facebook-messenger"></i>

      <span id="msgBadge" class="msgBadge hidden">
        0
      </span>

    </button>

    <!-- NOTIFICATIONS -->

    <button
      class="navBtn"
      onclick="toggleNotifications()">

      <i class="fa-solid fa-bell"></i>

    </button>

    <!-- LOGOUT -->

    <button
      class="navBtn"
      onclick="logout()">

      <i class="fa-solid fa-right-from-bracket"></i>

    </button>

  </div>

</nav>

<!-- ==================MAIN================== -->

<div class="main">

<!----storycard-->
<div class="storycard">
<div class="story">

  <div class="card">

  </div>
</div>
</div>


  <!-- CREATE POST -->

  <div class="postCreator">

    <textarea
      id="postInput"
      placeholder="Share Something with Circlo......">
      
    </textarea>

    <button
      class="postBtn"
      onclick="createPost()">

      Post to Circlo

    </button>

  </div>

  <!-- FEED -->

  <div id="feed"></div>

</div>
<!-- =========================
     CHAT PANEL
========================= -->

<div id="chatPanel" class="panel hidden">

  <!-- HEADER -->

  <div class="panelHeader">

    <h3>Circlo Chat</h3>

    <button onclick="toggleChat()">
      ✖

    </button>

  </div>

  <!-- CHAT BODY -->

  <div class="chatBody">

    <!-- MESSAGES -->

    <div id="chatMessages">

      <div id="typingIndicator" class="typingIndicator hidden">

        <div class="typingBubble"></div>
        <div class="typingBubble"></div>
        <div class="typingBubble"></div>

      </div>

    </div>

    <!-- INPUT AREA -->

    <div class="chatInputArea">

      <input
        type="text"
        id="chatInput"
        placeholder="Type message..."
        autocomplete="on"
      />

      <button id="sendBtn">

        <i class="fa-solid fa-paper-plane"></i>

      </button>

    </div>

  </div>

</div>




<!-- =========================
     DM PANEL
========================= -->

<div id="dmPanel" class="panel hidden">

  <div class="panelHeader">

    <h3>Messages</h3>

    <button onclick="toggleDM()">
      ✖
    </button>

  </div>

  <div id="dmList" class="panelContent"></div>

</div>

<!-- =========================
     NOTIFICATION PANEL
========================= -->

<div
  id="notificationPanel"
  class="panel hidden">

  <div class="panelHeader">

    <h3>
      Notifications
    </h3>

    <button onclick="toggleNotifications()">
      ✖
    </button>

  </div>

  <div class="panelContent">

    <div class="notify">

      <h4>
        Circlo Ready
      </h4>

      <p>
        Your realtime social app is active.
      </p>

    </div>

    <div class="notify">

      <h4>
        Messaging Enabled
      </h4>

      <p>
        Realtime chat connected successfully.
      </p>

    </div>

  </div>

</div>

<!-- =========================
     FRIENDS PANEL
========================= -->

<div id="friendsPanel" class="panel hidden">

  <div class="panelHeader">

    <h3>Friends</h3>

    <button onclick="toggleFriends()">
      ✖
    </button>

  </div>

  <div id="friendsList" class="panelContent"></div>

</div>

</body>

<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  doc,
  setDoc,
  getDoc,
  getDocs,
  updateDoc,
  increment,
  deleteDoc,
  orderBy

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey: "AIzaSyBmomWt8PoL7rQz52N4x3y7zbEYzjxneYU",

  authDomain: "circlo-bea39.firebaseapp.com",

  projectId: "circlo-bea39",

  storageBucket: "circlo-bea39.appspot.com",

  messagingSenderId: "287380738037",

  appId: "1:287380738037:web:3b132d5e0c9fa20937dabc"

};

/* =========================
   INIT
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const feed = document.getElementById("feed");

let loginMode = true;

window.activeChatUser = null;

/* =========================
   AUTH MODE
========================= */

window.toggleMode = ()=>{

  loginMode = !loginMode;

  document.getElementById(
    "authTitle"
  ).innerText = loginMode
  ? "Login"
  : "Register";

};

/* =========================
   AUTH
========================= */

window.authAction = async()=>{

  try{

    const email =
    document.getElementById(
      "email"
    ).value.trim();

    const password =
    document.getElementById(
      "password"
    ).value.trim();

    if(!email || !password){

      alert("Fill all fields");
      return;

    }

    if(loginMode){

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }else{

      const cred =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

      await setDoc(

        doc(
          db,
          "users",
          cred.user.uid
        ),

        {

          uid: cred.user.uid,

          username:
          email.split("@")[0],

          avatar:
          "https://i.pravatar.cc/150?u=" +
          cred.user.uid

        }

      );

    }

  }catch(err){

    console.error(err);

    alert(err.message);

  }

};

/* =========================
   LOGOUT
========================= */

window.logout = async()=>{

  await removePresence();

  signOut(auth);

};

/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth,(user)=>{

  if(user){

    document.getElementById(
      "authScreen"
    ).style.display = "none";

    loadPosts();

    loadTypingIndicator();

    setOnlinePresence();

    loadDMList();

  }else{

    document.getElementById(
      "authScreen"
    ).style.display = "flex";

  }

});

/* =========================
   CREATE POST
========================= */

window.createPost = async()=>{

  try{

    const user = auth.currentUser;

    if(!user){

      alert("You are not logged in");
      return;

    }

    const text =
    document.getElementById(
      "postInput"
    ).value.trim();

    if(!text){

      alert("Write something");
      return;

    }

    const userRef =
    doc(db,"users",user.uid);

    const snap =
    await getDoc(userRef);

    // CREATE USER PROFILE IF MISSING

    if(!snap.exists()){

      await setDoc(userRef,{

        uid:user.uid,

        username:user.email.split("@")[0],

        avatar:
        "https://i.pravatar.cc/150?u=" +
        user.uid

      });

    }

    const newSnap =
    await getDoc(userRef);

    const userData =
    newSnap.data();

    // CREATE POST

    await addDoc(

      collection(db,"posts"),

      {

        text:text,

        uid:user.uid,

        username:userData.username,

        avatar:userData.avatar,

        likes:0,

        createdAt:Date.now()

      }

    );

    // CLEAR INPUT

    document.getElementById(
      "postInput"
    ).value = "";

    alert("Post created!");

  }catch(err){

    console.error(err);

    alert(err.message);

  }

};

/* =========================
   LOAD POSTS
========================= */

function loadPosts(){

  onSnapshot(

    query(
      collection(db,"posts")
    ),

    (snap)=>{

      feed.innerHTML = "";

      const posts = [];

      snap.forEach((docu)=>{

        posts.push({

          id:docu.id,

          ...docu.data()

        });

      });

      posts.sort(
        (a,b)=>
        b.createdAt-a.createdAt
      );

      posts.forEach((post)=>{

        const div =
        document.createElement("div");

        div.className = "post";

        div.innerHTML = `

          <div class="postHeader">

            <img src="${post.avatar}" />

            <div>

              <h4>
                @${post.username}
              </h4>

            </div>

          </div>

          <div class="postBody">

            ${post.text}

          </div>

          <div class="postActions">

            <button
              onclick="likePost('${post.id}')">

              ❤️ ${post.likes || 0}

            </button>

          </div>

        `;

        feed.appendChild(div);

      });

    }

  );

}

/* =========================
   LIKE POST
========================= */

window.likePost = async(id)=>{

  await updateDoc(

    doc(db,"posts",id),

    {

      likes:
      increment(1)

    }

  );

};

/* =========================
   PANELS
========================= */

window.toggleChat = ()=>{

  document
  .getElementById(
    "chatPanel"
  )
  .classList.toggle("hidden");

};

window.toggleFriends = ()=>{

  document
  .getElementById(
    "friendsPanel"
  )
  .classList.toggle("hidden");

  loadFriends();

};

window.toggleNotifications = ()=>{

  document
  .getElementById(
    "notificationPanel"
  )
  .classList.toggle("hidden");

};

window.toggleDM = ()=>{

  document
  .getElementById(
    "dmPanel"
  )
  .classList.toggle("hidden");

  loadDMList();

};

/* =========================
   CHAT HELPERS
========================= */

function getChatId(uid1, uid2){

  return [uid1, uid2]
  .sort()
  .join("_");

}

/* =========================
   CHAT INPUT
========================= */

const sendBtn =
document.getElementById(
  "sendBtn"
);

const chatInput =
document.getElementById(
  "chatInput"
);

/* =========================
   SEND BUTTON
========================= */

if(sendBtn){

  sendBtn.addEventListener(
    "click",
    ()=>{

      sendMessage();

    }
  );

}

/* =========================
   SEND MESSAGE
========================= */

window.sendMessage = async()=>{

  try{

    const user =
    auth.currentUser;

    if(
      !user ||
      !window.activeChatUser
    ) return;

    const input =
    document.getElementById(
      "chatInput"
    );

    if(!input) return;

    const text =
    input.value.trim();

    if(!text) return;

    const chatId =
    getChatId(
      user.uid,
      window.activeChatUser
    );

    await addDoc(

      collection(
        db,
        "chats",
        chatId,
        "messages"
      ),

      {

        text,

        uid:user.uid,

        createdAt:Date.now()

      }

    );

    await setDoc(

      doc(
        db,
        "conversations",
        chatId
      ),

      {

        chatId,

        users:[
          user.uid,
          window.activeChatUser
        ],

        lastMessage:text,

        updatedAt:Date.now()

      }

    );

    input.value = "";

  }catch(err){

    console.error(err);

  }

};

/* =========================
   LOAD PRIVATE CHAT
========================= */

function loadPrivateChat(){

  const user =
  auth.currentUser;

  if(
    !user ||
    !window.activeChatUser
  ) return;

  const chatId =
  getChatId(
    user.uid,
    window.activeChatUser
  );

  const chatMessages =
  document.getElementById(
    "chatMessages"
  );

  if(!chatMessages) return;

  onSnapshot(

    query(
      collection(
        db,
        "chats",
        chatId,
        "messages"
      )
    ),

    (snap)=>{

      chatMessages.innerHTML = "";

      const messages = [];

      snap.forEach((docu)=>{

        messages.push(docu.data());

      });

      messages.sort(
        (a,b)=>
        a.createdAt-b.createdAt
      );

      messages.forEach((msg)=>{

        const div =
        document.createElement("div");

        div.innerHTML = `

          <div class="${
            msg.uid === auth.currentUser.uid
            ? "myMessage"
            : "theirMessage"
          }">

            ${msg.text}

          </div>

        `;

        chatMessages.appendChild(div);

      });

      chatMessages.scrollTop =
      chatMessages.scrollHeight;

    }

  );

}

/* =========================
   TYPING SYSTEM
========================= */

let typingTimeout;

if(chatInput){

  chatInput.addEventListener(

    "input",

    async()=>{

      const user =
      auth.currentUser;

      if(!user) return;

      await setDoc(

        doc(
          db,
          "typingStatus",
          user.uid
        ),

        {

          typing:true,

          uid:user.uid

        }

      );

      clearTimeout(
        typingTimeout
      );

      typingTimeout =
      setTimeout(async()=>{

        try{

          await deleteDoc(

            doc(
              db,
              "typingStatus",
              user.uid
            )

          );

        }catch(err){

          console.error(err);

        }

      },1200);

    }

  );

}

/* =========================
   LOAD TYPING
========================= */

function loadTypingIndicator(){

  onSnapshot(

    collection(
      db,
      "typingStatus"
    ),

    (snap)=>{

      const indicator =
      document.getElementById(
        "typingIndicator"
      );

      if(!indicator) return;

      let someoneTyping =
      false;

      snap.forEach((docu)=>{

        if(
          docu.id !==
          auth.currentUser?.uid
        ){

          someoneTyping =
          true;

        }

      });

      if(someoneTyping){

        indicator.classList.remove(
          "hidden"
        );

      }else{

        indicator.classList.add(
          "hidden"
        );

      }

    }

  );

}

/* =========================
   LOAD DM LIST
========================= */

function loadDMList(){

  const user =
  auth.currentUser;

  if(!user) return;

  const box =
  document.getElementById(
    "dmList"
  );

  if(!box) return;

  onSnapshot(

    collection(
      db,
      "conversations"
    ),

    (snap)=>{

      box.innerHTML = "";

      const chats = [];

      snap.forEach((docu)=>{

        const data =
        docu.data();

        if(
          data.users &&
          data.users.includes(user.uid)
        ){

          chats.push(data);

        }

      });

      chats.sort(
        (a,b)=>
        b.updatedAt-a.updatedAt
      );

      if(chats.length === 0){

        box.innerHTML = `

          <p style="padding:10px;color:#666">

            No messages yet

          </p>

        `;

        return;

      }

      chats.forEach((chat)=>{

        const otherUid =
        chat.users.find(
          u => u !== user.uid
        );

        getDoc(

          doc(
            db,
            "users",
            otherUid
          )

        ).then((userDoc)=>{

          const u =
          userDoc.data();

          if(!u) return;

          const div =
          document.createElement("div");

          div.className =
          "friend";

          div.onclick = ()=>{

            window.activeChatUser =
            otherUid;

            toggleDM();

            toggleChat();

            loadPrivateChat();

          };

          div.innerHTML = `

            <img src="${u.avatar}" />

            <div>

              <h4>
                @${u.username}
              </h4>

              <span>
                ${chat.lastMessage || "No messages yet"}
              </span>

            </div>

          `;

          box.appendChild(div);

        });

      });

    }

  );

}

/* =========================
   FRIENDS
========================= */

async function loadFriends(){

  const box =
  document.getElementById(
    "friendsList"
  );

  if(!box) return;

  const currentUser =
  auth.currentUser;

  const usersSnap =
  await getDocs(
    collection(db,"users")
  );

  onSnapshot(

    collection(
      db,
      "presence"
    ),

    (presenceSnap)=>{

      const onlineUsers = [];

      presenceSnap.forEach((docu)=>{

        onlineUsers.push(
          docu.id
        );

      });

      box.innerHTML = "";

      usersSnap.forEach((docu)=>{

        const user =
        docu.data();

        if(
          user.uid ===
          currentUser.uid
        ) return;

        const isOnline =
        onlineUsers.includes(
          user.uid
        );

        const div =
        document.createElement("div");

        div.className =
        "friend";

        div.onclick = ()=>{

          window.activeChatUser =
          user.uid;

          toggleFriends();

          toggleChat();

          loadPrivateChat();

        };

        div.innerHTML = `

          <img src="${user.avatar}" />

          <div>

            <h4>
              @${user.username}
            </h4>

            <div class="presenceRow">

              <div
                class="onlineDot"
                style="
                  background:
                  ${isOnline
                    ? '#00ff88'
                    : '#94a3b8'};
                ">
              </div>

              <span class="presenceText">

                ${
                  isOnline
                  ? "Active now"
                  : "Offline"
                }

              </span>

            </div>

          </div>

        `;

        box.appendChild(div);

      });

    }

  );

}

/* =========================
   ONLINE PRESENCE
========================= */

async function setOnlinePresence(){

  const user =
  auth.currentUser;

  if(!user) return;

  await setDoc(

    doc(
      db,
      "presence",
      user.uid
    ),

    {

      uid:user.uid,

      online:true,

      lastSeen:Date.now()

    }

  );

}

async function removePresence(){

  const user =
  auth.currentUser;

  if(!user) return;

  try{

    await deleteDoc(

      doc(
        db,
        "presence",
        user.uid
      )

    );

  }catch(err){

    console.error(err);

  }

}

/* =========================
   ENTER TO SEND
========================= */

if(chatInput){

  chatInput.addEventListener(
    "keypress",
    (e)=>{

      if(e.key === "Enter"){

        e.preventDefault();

        sendMessage();

      }

    }
  );

}

</script>


</html>
