<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Circlo</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<style>

/* =========================
   ROOT
========================= */

:root{
  --primary:#00b7ff;
  --secondary:#0284c7;
  --dark:#0f172a;
  --light:#f8fafc;
  --card:#ffffff;
  --border:#e2e8f0;
  --shadow:0 10px 35px rgba(0,0,0,0.08);
  --radius:22px;
}

/* =========================
   GLOBAL
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:
    Inter,
    system-ui,
    sans-serif;
}

body{
  background:
    linear-gradient(
      135deg,
      #f8fbff,
      #eef6ff
    );
  color:#111827;
  overflow-x:hidden;
}

button{
  cursor:pointer;
  border:none;
  transition:0.2s;
}

button:hover{
  transform:scale(1.03);
}

img{
  object-fit:cover;
}

/* =========================
   NAVBAR
========================= */

nav{
  position:sticky;
  top:0;
  z-index:999;
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:
    rgba(5, 190, 247, 0.747);
  backdrop-filter:blur(18px);
  box-shadow: 5px 2px 3px 1px rgb(122, 128, 128);
  border-bottom:
    1px solid rgba(255,255,255,0.3);
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:1px;
  background:
    linear-gradient(
      135deg,
      #fafbfc,
      #e1e5eb
    );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.navActions{
  display:flex;
  align-items:center;
  gap:10px;
}

.navBtn{
  width:48px;
  height:48px;
  border-radius:50%;
  background:white;
  color:#0f172a;
  font-size:18px;
  box-shadow:var(--shadow);
}

/* =========================
   LAYOUT
========================= */

.main{
  width:100%;
  max-width:750px;
  margin:auto;
  padding:20px;
}

/* =========================
   CREATE POST
========================= */

.postCreator{
  
  background:var(--card);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.postCreator textarea{
  width:100%;
  min-height:110px;
  border:none;
  resize:none;
  outline:none;
  font-size:16px;
  background:transparent;

}

.postBtn{
  margin-top:12px;
  width:90%;
  padding:14px;
  border-radius:14px;
  background:
    linear-gradient(
      135deg,
      #00b7ff,
      #0077ff
    );
  color:white;
  font-size:15px;
  font-weight:600;
}

/* =========================
   POSTS
========================= */

.post{
  background:white;
  border-radius:var(--radius);
  margin-bottom:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.postHeader{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
}

.postHeader img{
  width:52px;
  height:52px;
  border-radius:50%;
}

.postHeader h4{
  font-size:15px;
}

.postBody{
  padding:0 16px 16px;
  line-height:1.7;
  font-size:15px;
}

.postActions{
  display:flex;
  justify-content:space-around;
  padding:15px;
  border-top:1px solid #f1f5f9;
}

.postActions button{
  background:none;
  font-size:15px;
  color:#334155;
}

/* =========================
   PANELS
========================= */

.panel{
  position:fixed;
  top:85px;
  right:20px;

  width:360px;
  height:520px;

  background:white;
  border-radius:26px;

  overflow:hidden;

  display:flex;
  flex-direction:column;

  box-shadow:
    0 25px 50px rgba(0,0,0,0.16);

  z-index:9999;

  animation:pop 0.2s ease;
}

.hidden{
  display:none;
}

@keyframes pop{

  from{
    opacity:0;
    transform:
      translateY(10px)
      scale(0.96);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}

.panelHeader{
  padding:18px;

  background:
    linear-gradient(
      135deg,
      #00b7ff,
      #0077ff
    );

  color:white;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.panelHeader h3{
  font-size:18px;
}

.panelHeader button{
  background:none;
  color:white;
  font-size:20px;
}

.panelContent{
  flex:1;
  overflow-y:auto;
  padding:15px;
  background:#f8fafc;
}

/* =========================
   CHAT
========================= */

.message{
  max-width:75%;
  padding:12px 15px;
  border-radius:18px;
  margin-bottom:10px;
  font-size:14px;
  line-height:1.4;
}

.me{
  background:
    linear-gradient(
      135deg,
      #0a79a5,
      #0f60bd
    );
  color:white;
  margin-left:auto;
}

.them{
  background:white;
  color:#111827;
}

.chatInputArea{
  display:flex;
  padding:12px;
  background:white;
  border-top:1px solid #f1f5f9;
}

.chatInputArea input{
  flex:1;
  border:none;
  outline:none;
  padding:14px;
  background:#f1f5f9;
  border-radius:14px;
}

.chatInputArea button{
  margin-left:8px;
  width:52px;
  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #1a769b,
      #2572ca
    );

  }

/* =========================
   TYPING INDICATOR
========================= */

.typingIndicator{

  display:flex;
  align-items:center;
  gap:6px;

  background:white;

  width:max-content;

  padding:12px 16px;

  border-radius:18px;

  margin-bottom:10px;

  box-shadow:
    0 5px 15px rgba(0,0,0,0.06);

}

.typingIndicator span{

  font-size:13px;
  color:#64748b;

}

.typingBubble{

  width:8px;
  height:8px;

  border-radius:50%;

  background:#94a3b8;

  animation:
    bounce 1s infinite;

}

.typingBubble:nth-child(2){

  animation-delay:0.15s;

}

.typingBubble:nth-child(3){

  animation-delay:0.3s;

}

@keyframes bounce{

  0%{
    transform:translateY(0);
    opacity:0.5;
  }

  50%{
    transform:translateY(-4px);
    opacity:1;
  }

  100%{
    transform:translateY(0);
    opacity:0.5;
  }

}
  color:white;{

  }


/* =========================
   FRIENDS
========================= */

.friend{
  background:white;
  border-radius:18px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.friend img{
  width:50px;
  height:50px;
  border-radius:50%;
}

.friend span{
  font-size:14px;
  color:#475569;
}

/* =========================
   ONLINE PRESENCE
========================= */

.presenceRow{

  display:flex;
  align-items:center;
  gap:6px;

  margin-top:4px;

}

.onlineDot{

  width:10px;
  height:10px;

  border-radius:50%;

  background:#00ff88;

  box-shadow:
    0 0 12px
    rgba(0,255,136,0.8);

  animation:
    onlinePulse 1.5s infinite;

}

@keyframes onlinePulse{

  0%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.3);
    opacity:0.6;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }

}

.presenceText{

  font-size:13px;
  color:#64748b;

}
/* =========================
   NOTIFICATIONS
========================= */

.notify{
  background:white;
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
}

.notify h4{
  margin-bottom:4px;
}

/* =========================
   AUTH
========================= */

#authScreen{
  position:fixed;
  inset:0;
  z-index:99999;

  background:
    rgba(255,255,255,0.7);

  backdrop-filter:blur(18px);

  display:flex;
  align-items:center;
  justify-content:center;
}

.authBox{
  width:360px;
  background:white;
  border-radius:28px;
  padding:28px;
  box-shadow:var(--shadow);
}

.authBox h2{
  text-align:center;
  margin-bottom:20px;
}

.authBox input{
  width:100%;
  margin-bottom:12px;
  padding:15px;
  border:none;
  background:#f1f5f9;
  border-radius:14px;
  outline:none;
}

.authBtn{
  width:100%;
  padding:15px;
  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #00b7ff,
      #0077ff
    );

  color:white;
  font-size:15px;
  font-weight:600;
}

.switchText{
  margin-top:14px;
  text-align:center;
  color:#64748b;
  cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

  nav{
    padding:0 12px;
  }

  .logo{
    font-size:24px;
  }

  .navBtn{
    width:44px;
    height:44px;
    font-size:16px;
  }

  .main{
    padding:12px;
  }

  .panel{
    width:100%;
    height:100%;
    top:0;
    right:0;
    border-radius:0;
  }

  .authBox{
    width:92%;
  }

}

.fixedChatInput{
  display:flex;
  gap:10px;
  padding:12px;
  background:white;
  border-top:1px solid #e2e8f0;
  align-items:center;
}

.fixedChatInput input{
  flex:1;
  padding:12px 14px;
  border:none;
  outline:none;
  background:#f1f5f9;
  border-radius:12px;
  font-size:15px;
  color:#111827;
}

.fixedChatInput button{
  width:48px;
  height:48px;
  border-radius:12px;
  background:linear-gradient(135deg,#00b7ff,#0077ff);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

</style>
</head>

<body>

     AUTH SCREEN

<!-- =========================
     FIREBASE
========================= -->
<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  doc,
  setDoc,
  getDoc,
  getDocs,
  updateDoc,
  increment,
  deleteDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey: "AIzaSyBmomWt8PoL7rQz52N4x3y7zbEYzjxneYU",

  authDomain: "circlo-bea39.firebaseapp.com",

  projectId: "circlo-bea39",

  storageBucket: "circlo-bea39.appspot.com",

  messagingSenderId: "287380738037",

  appId: "1:287380738037:web:3b132d5e0c9fa20937dabc"

};

/* =========================
   INIT
========================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const feed =
document.getElementById("feed");

let loginMode = true;

/* =========================
   AUTH MODE
========================= */

window.toggleMode = ()=>{

  loginMode = !loginMode;

  document.getElementById(
    "authTitle"
  ).innerText =

    loginMode
    ? "Login"
    : "Register";

};

/* =========================
   AUTH
========================= */

window.activeChatUser = null;

window.authAction = async()=>{

  try{

    const email =
    document.getElementById(
      "email"
    ).value.trim();

    const password =
    document.getElementById(
      "password"
    ).value.trim();

    if(!email || !password){

      alert("Fill all fields");
      return;

    }

    if(loginMode){

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }else{

      const cred =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

      await setDoc(

        doc(
          db,
          "users",
          cred.user.uid
        ),

        {

          uid:cred.user.uid,

          username:
          email.split("@")[0],

          avatar:
          "https://i.pravatar.cc/150?u=" +
          cred.user.uid

        }

      );

    }

  }catch(err){

    console.error(err);

    alert(err.message);

  }

};

/* =========================
   LOGOUT
========================= */

window.logout = ()=>{

  removePresence();

  signOut(auth);

};

/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth,(user)=>{

  if(user){

    document.getElementById(
      "authScreen"
    ).style.display = "none";

    loadPosts();

    loadChat();

    loadTypingIndicator();

    setOnlinePresence();

  }else{

    document.getElementById(
      "authScreen"
    ).style.display = "flex";

  }

});

/* =========================
   CREATE POST
========================= */

window.createPost = async()=>{

  try{

    const user =
    auth.currentUser;

    if(!user) return;

    const text =
    document.getElementById(
      "postInput"
    ).value.trim();

    if(!text){

      alert("Write something");
      return;

    }

    const snap =
    await getDoc(
      doc(db,"users",user.uid)
    );

    const userData =
    snap.data();

    await addDoc(

      collection(db,"posts"),

      {

        text,

        uid:user.uid,

        username:userData.username,

        avatar:userData.avatar,

        likes:0,

        createdAt:Date.now()

      }

    );

    document.getElementById(
      "postInput"
    ).value = "";

  }catch(err){

    console.error(err);

  }

};

/* =========================
   LOAD POSTS
========================= */

function loadPosts(){

  onSnapshot(

    query(
      collection(db,"posts")
    ),

    (snap)=>{

      feed.innerHTML = "";

      const posts = [];

      snap.forEach((docu)=>{

        posts.push({

          id:docu.id,

          ...docu.data()

        });

      });

      posts.sort(
        (a,b)=>
        b.createdAt-a.createdAt
      );

      posts.forEach((post)=>{

        const div =
        document.createElement("div");

        div.className = "post";

        div.innerHTML = `

          <div class="postHeader">

            <img src="${post.avatar}" />

            <div>

              <h4>
                @${post.username}
              </h4>

            </div>

          </div>

          <div class="postBody">

            ${post.text}

          </div>

          <div class="postActions">

            <button
              onclick="likePost('${post.id}')">

              ❤️ ${post.likes || 0}

            </button>

          </div>

        `;

        feed.appendChild(div);

      });

    }

  );

}

/* =========================
   LIKE POST
========================= */

window.likePost = async(id)=>{

  await updateDoc(

    doc(db,"posts",id),

    {

      likes:
      increment(1)

    }

  );

};

/* =========================
   PANELS
========================= */

window.toggleChat = ()=>{

  document
  .getElementById(
    "chatPanel"
  )
  .classList.toggle("hidden");

};

window.toggleFriends = ()=>{

  document
  .getElementById(
    "friendsPanel"
  )
  .classList.toggle("hidden");

  loadFriends();

};

window.toggleNotifications = ()=>{

  document
  .getElementById(
    "notificationPanel"
  )
  .classList.toggle("hidden");

};

/* =========================
   SEND MESSAGE

   /*===ToggleForMessage===*/
   window.toggleDM = ()=>{
  document.getElementById("dmPanel").classList.toggle("hidden");
  loadDMList();
};

/*======================== */
window.sendMessage = async()=>{

  const user = auth.currentUser;
  if(!user || !window.activeChatUser) return;

  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;

  const chatId = getChatId(user.uid, window.activeChatUser);

  // 1. Save message
  await addDoc(
    collection(db, "chats", chatId, "messages"),
    {
      text,
      uid: user.uid,
      createdAt: Date.now()
    }
  );

  // 2. Update conversation (IMPORTANT)
  await setDoc(
    doc(db, "conversations", chatId),
    {
      chatId,
      users: [user.uid, window.activeChatUser],
      lastMessage: text,
      updatedAt: Date.now()
    }
  );

  input.value = "";
};

/* =========================
   TYPING SYSTEM
========================= */

let typingTimeout;

const chatInput =
document.getElementById(
  "chatInput"
);

if(chatInput){

  chatInput.addEventListener(

    "input",

    async()=>{

      const user =
      auth.currentUser;

      if(!user) return;

      await setDoc(

        doc(
          db,
          "typingStatus",
          user.uid
        ),

        {

          typing:true,

          uid:user.uid

        }

      );

      clearTimeout(
        typingTimeout
      );

      typingTimeout =
      setTimeout(async()=>{

        await deleteDoc(

          doc(
            db,
            "typingStatus",
            user.uid
          )

        );

      },1200);

    }

  );

}

/* =========================
   LOAD TYPING
========================= */
function loadDMList(){

  const user = auth.currentUser;
  if(!user) return;

  const box = document.getElementById("dmList");
  if(!box) return;

  onSnapshot(collection(db,"conversations"), (snap)=>{

    box.innerHTML = "";

    const chats = [];

    snap.forEach(docu=>{
      const data = docu.data();

      if(data.users && data.users.includes(user.uid)){
        chats.push(data);
      }
    });

    chats.sort((a,b)=>b.updatedAt - a.updatedAt);

    if(chats.length === 0){
      box.innerHTML = "<p style='padding:10px;color:#666'>No messages yet</p>";
      return;
    }

    chats.forEach(chat=>{

      const otherUid = chat.users.find(u => u !== user.uid);

      getDoc(doc(db,"users",otherUid)).then(userDoc=>{

        const u = userDoc.data();
        if(!u) return;

        const div = document.createElement("div");
        div.className = "friend";

        div.onclick = ()=>{
          window.activeChatUser = otherUid;
          toggleDM();       // close inbox
          toggleChat();     // open chat
          loadPrivateChat();
        };

        div.innerHTML = `
          <img src="${u.avatar}" />
          <div>
            <h4>@${u.username}</h4>
            <span>${chat.lastMessage || "No messages yet"}</span>
          </div>
        `;

        box.appendChild(div);
      });
    });

  });

}

/* =========================
   FRIENDS
========================= */

async function loadFriends(){

  const box =
  document.getElementById(
    "friendsList"
  );

  if(!box) return;

  const usersSnap =
  await getDocs(
    collection(db,"users")
  );

  onSnapshot(

    collection(
      db,
      "presence"
    ),

    (presenceSnap)=>{

      const onlineUsers = [];

      presenceSnap.forEach((docu)=>{

        onlineUsers.push(
          docu.id
        );

      });

      box.innerHTML = "";

      usersSnap.forEach((docu)=>{

        const user =
        docu.data();

        const isOnline =
        onlineUsers.includes(
          user.uid
        );

        const div =
        document.createElement("div");

        div.className = "friend";

        div.innerHTML = `

          <img src="${user.avatar}" />

          <div>

            <h4>
              @${user.username}
            </h4>

            <div class="presenceRow">

              <div
                class="onlineDot"
                style="
                  background:
                  ${isOnline
                    ? '#00ff88'
                    : '#94a3b8'};
                ">
              </div>

              <span class="presenceText">

                ${
                  isOnline
                  ? "Active now"
                  : "Offline"
                }

              </span>

            </div>

          </div>

        `;

        box.appendChild(div);

      });

    }

  );

}

</script>
