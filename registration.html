<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .main {
      width: 500px;
      height: 90vh;
      background-color: white;
      padding: 20px;
      border-radius:30px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #037fc7;
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input[type="text"], input[type="password"], input[type="email"] {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 50%;
      padding: 10px;
      background-color: #2dc3ce;
      color: white;
      border: none;
      border-radius: 5px;
      margin-left: 25%;
      cursor: pointer;
    }

    .hero{
      display: flex;
      gap: 20px;
    }

    button:hover {
      background-color: #017d81;
    }
  </style>
</head>
<body>
  <div class="hero">

  <div class="main">
    <h1>Register</h1>

    <form action="/register" method="post">
      <label for="FirstName:">FirstName:</label> 
      <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required><br>
      <label for="LastName:">LastName:</label> 
      <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" required><br>

      <label for="Address">Address:</label> 
      <input type="text" id="address" name="address" placeholder="Enter your address" required><br>
      <label for="Email">Email:</label> 
      <input type="email" id="email" name="email" placeholder="Enter your email" required><br>
      <label for="createPassword">Create Password:</label>
      <input type="password" id="createPassword" name="createPassword" placeholder="Create your password" required><br>

<label for="Select Country">Select Countries:</label>
      <select id="Country"> 
        <option value="Select Country"></option>
        <option value="United State">United State</option>
        <option value=""></option>
        <option value="Nigeria">Nigeria</option>
        <option value="Niger">Niger</option>
      </select>


      <label for="password">Confirm Password:</label>
      <input type="password" id="password" name="password" placeholder="Confirm your password" required><br><br>

      <button>Register</button>
    </form>
  </div>


  <div class="main">
 
  
  </div>
  </div>
  
</body>
</html>
